      to { transform: rotate(360deg); }
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes slideDown {
      from { transform: translateY(0); opacity: 1; }

      from { opacity: 0; }
      to { opacity: 1; }

    .animate-slide-down { animation: slideDown 0.2s ease-in forwards; }
    .animate-fade-in { animation: fadeIn 0.3s ease-out; }

                }}
              >
                <div
                  className="absolute text-center"
                  style={{
                    transform: `rotate(${anglePerDish / 2}deg) translateX(70px)`,
                    left: '50%'
                  }}
                >
                  <div className="text-2xl">{dish.emoji}</div>
                  <div
                    className="text-xs font-medium mt-1 whitespace-nowrap"
                    style={{ color: '#5D4E37', transform: `rotate(${anglePerDish / 2}deg)`, transformOrigin: 'center' }}
                  >
                    {dish.name.slice(0, 4)}
                  </div>
                </div>
              </div>
            ))}
          </div>

          {/* 中心按钮 */}
          <button
            onClick={onSelect}
            disabled={!selectedDish}
            className={`absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-20 h-20 rounded-full shadow-lg flex flex-col items-center justify-center transition-all duration-200 ${
              selectedDish ? 'bg-white cursor-pointer hover:scale-105 active:scale-95' : 'bg-gray-200 cursor-not-allowed'
            }`}
            style={{ color: '#5D4E37' }}
          >
            {selectedDish ? (
              <>
                <span className="text-2xl">{selectedDish.emoji}</span>
                <span className="text-xs font-medium mt-1">查看详情</span>
              </>
            ) : (
              <span className="text-gray-400 text-xs">等待转动</span>
            )}
          </button>
        </div>
      );
    };

    const SpinButton = ({ onClick, disabled }) => (
      <button
        onClick={onClick}
        disabled={disabled}
        className={`w-48 h-14 rounded-full text-white text-lg font-bold shadow-lg transition-all duration-200 mt-6 ${
          disabled
            ? 'bg-gray-300 cursor-not-allowed'
            : 'bg-gradient-to-r from-[#FF9A56] to-[#FF8C42] hover:shadow-xl hover:scale-105 active:scale-95'
        }`}
      >
        {disabled ? '🎡 转动中...' : '🎲 开始转动'}
      </button>
    );

    const DishModal = ({ dish, onClose, onReroll, isFavorite, onToggleFavorite }) => {
      const [isClosing, setIsClosing] = useState(false);

      const handleClose = () => {
        setIsClosing(true);
        setTimeout(onClose, 200);
      };

      if (!dish) return null;

      return (
        <div
          className={`fixed inset-0 z-50 flex items-end justify-center ${isClosing ? 'animate-fade-in' : ''}`}
          style={{ backgroundColor: 'rgba(0,0,0,0.5)' }}
          onClick={handleClose}
        >
          <div
            className={`bg-white rounded-t-3xl w-full max-w-md max-h-[85vh] overflow-y-auto ${isClosing ? 'animate-slide-down' : 'animate-slide-up'}`}
            onClick={e => e.stopPropagation()}
          >
            {/* 头部 */}
            <div className="sticky top-0 bg-white pt-6 px-6 pb-4 border-b border-gray-100">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <span className="text-4xl">{dish.emoji}</span>
                  <div>
                    <h2 className="text-xl font-bold" style={{ color: '#5D4E37' }}>{dish.name}</h2>
                    <span
                      className="text-xs px-2 py-1 rounded-full text-white mt-1 inline-block"
                      style={{ background: dish.category === 'meat' ? '#FF8C42' : '#4CAF50' }}
                    >
                      {dish.category === 'meat' ? '🥩 荤菜' : '🥬 素菜'}
                    </span>
                  </div>
                </div>
                <button
                  onClick={handleClose}
                  className="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-400 hover:bg-gray-200"
                >
                  ✕
                </button>
              </div>
            </div>

            {/* 内容 */}
            <div className="px-6 py-4">
              {/* 食材 */}
              <div className="mb-6">
                <h3 className="text-base font-semibold mb-3 flex items-center gap-2" style={{ color: '#5D4E37' }}>
                  <span>📝</span> 所需食材
                </h3>
                <div className="flex flex-wrap gap-2">
                  {dish.ingredients.map((item, index) => (
                    <span
                      key={index}
                      className="px-3 py-1.5 rounded-full text-sm"
                      style={{ backgroundColor: '#FFF8F0', color: '#5D4E37' }}
                    >
                      {item}
                    </span>
                  ))}
                </div>
              </div>

              {/* 步骤 */}
              <div className="mb-6">
                <h3 className="text-base font-semibold mb-3 flex items-center gap-2" style={{ color: '#5D4E37' }}>
                  <span>👨‍🍳</span> 烹饪步骤
                </h3>
                <div className="space-y-3">
                  {dish.steps.map((step, index) => (
                    <div key={index} className="flex gap-3">
                      <span
                        className="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold text-white flex-shrink-0"
                        style={{ background: '#FF9A56' }}
                      >
                        {index + 1}
                      </span>
                      <p className="text-sm leading-relaxed" style={{ color: '#5D4E37' }}>
                        {step}
                      </p>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* 底部操作 */}
            <div className="sticky bottom-0 bg-white border-t border-gray-100 px-6 py-4 flex gap-3">
              <button
                onClick={onReroll}
                className="flex-1 py-3 px-4 rounded-xl border-2 border-[#FF9A56] text-[#FF9A56] font-medium flex items-center justify-center gap-2"
              >
                <span>🔄</span> 再来一个
              </button>
              <button
                onClick={() => onToggleFavorite(dish.id)}
                className={`w-14 h-14 rounded-xl border-2 flex items-center justify-center transition-all ${
                  isFavorite ? 'border-red-400 bg-red-50' : 'border-gray-200'
                }`}
              >
                <span className={`text-2xl ${isFavorite ? 'animate-heartbeat' : ''}`}>
                  {isFavorite ? '❤️' : '🤍'}
                </span>
              </button>
            </div>
          </div>
        </div>
      );
    };

    const DishCard = ({ dish, onClick, onRemove, showRemove }) => (
      <div
        onClick={onClick}
        className="bg-white rounded-2xl p-4 shadow-sm flex items-center gap-3 cursor-pointer hover:shadow-md transition-all active:scale-[0.98]"
      >
        <span className="text-3xl">{dish.emoji}</span>
        <div className="flex-1 min-w-0">
          <h3 className="font-medium truncate" style={{ color: '#5D4E37' }}>{dish.name}</h3>
          <span
            className="text-xs px-2 py-0.5 rounded-full text-white"
            style={{ background: dish.category === 'meat' ? '#FF8C42' : '#4CAF50' }}
          >
            {dish.category === 'meat' ? '荤菜' : '素菜'}
          </span>
        </div>
        {showRemove && (
          <button
            onClick={(e) => { e.stopPropagation(); onRemove(); }}
            className="w-8 h-8 rounded-full bg-red-50 text-red-400 flex items-center justify-center hover:bg-red-100"
          >
            ✕
          </button>
        )}
      </div>
    );

    const EmptyState = ({ icon, title, message }) => (
      <div className="flex flex-col items-center justify-center py-12 text-center">
        <span className="text-5xl mb-4">{icon}</span>
        <h3 className="text-lg font-medium mb-2" style={{ color: '#5D4E37' }}>{title}</h3>
        <p className="text-sm" style={{ color: '#8B7355' }}>{message}</p>
      </div>
    );

    // 主应用
    const App = () => {
      const [activeTab, setActiveTab] = useState('all');
      const [isSpinning, setIsSpinning] = useState(false);
      const [rotation, setRotation] = useState(0);
      const [selectedDish, setSelectedDish] = useState(null);
      const [showModal, setShowModal] = useState(false);
      const [page, setPage] = useState('home');
      const [favorites, setFavorites] = useState([]);
      const [history, setHistory] = useState([]);

      // 加载 LocalStorage 数据
      useEffect(() => {
        try {
          const savedFavorites = localStorage.getItem('whatToEat_favorites');
          const savedHistory = localStorage.getItem('whatToEat_history');
          if (savedFavorites) setFavorites(JSON.parse(savedFavorites));
          if (savedHistory) setHistory(JSON.parse(savedHistory));
        } catch (e) {
          console.log('Failed to load from localStorage');
        }
      }, []);

      // 保存收藏
      useEffect(() => {
        try {
          localStorage.setItem('whatToEat_favorites', JSON.stringify(favorites));
        } catch (e) {
          console.log('Failed to save favorites');
        }
      }, [favorites]);

      // 保存历史
      useEffect(() => {
        try {
          localStorage.setItem('whatToEat_history', JSON.stringify(history));
        } catch (e) {
          console.log('Failed to save history');
        }
      }, [history]);

      // 过滤菜品
      const filteredDishes = useMemo(() => {
        if (activeTab === 'all') return DISHES_DATA;
        return DISHES_DATA.filter(dish => dish.category === activeTab);
      }, [activeTab]);

      // 转动转盘
      const spin = useCallback(() => {
        if (isSpinning) return;
        setIsSpinning(true);
        setSelectedDish(null);

        const extraSpins = 5 * 360;
        const randomAngle = Math.floor(Math.random() * 360);
        const newRotation = rotation + extraSpins + randomAngle;

        setRotation(newRotation);

        setTimeout(() => {
          setIsSpinning(false);
          // 根据旋转角度计算选中的菜品
          const normalizedRotation = newRotation % 360;
          const segmentAngle = 360 / filteredDishes.length;
          const selectedIndex = Math.floor((360 - normalizedRotation + segmentAngle / 2) / segmentAngle) % filteredDishes.length;
          const dish = filteredDishes[selectedIndex] || filteredDishes[0];
          setSelectedDish(dish);
        }, 4000);
      }, [isSpinning, rotation, filteredDishes]);

      // 打开详情
      const openModal = useCallback(() => {
        if (!selectedDish) return;
        setShowModal(true);
        // 添加到历史记录
        setHistory(prev => {
          const newHistory = [{ ...selectedDish, timestamp: Date.now() }, ...prev].slice(0, 20);
          return newHistory;
        });
      }, [selectedDish]);

      // 切换收藏
      const toggleFavorite = useCallback((dishId) => {
        setFavorites(prev => {
          if (prev.includes(dishId)) {
            return prev.filter(id => id !== dishId);
          } else {
            return [...prev, dishId];
          }
        });
      }, []);

      // 重新抽取
      const handleReroll = useCallback(() => {
        setShowModal(false);
        setTimeout(() => {
          spin();
        }, 300);
      }, [spin]);

      // 渲染内容
      const renderContent = () => {
        if (page === 'favorites') {
          const favoriteDishes = DISHES_DATA.filter(dish => favorites.includes(dish.id));
          return (
            <div className="max-w-md mx-auto px-4 py-6">
              <h2 className="text-xl font-bold mb-4" style={{ color: '#5D4E37' }}>
                ❤️ 我的收藏 ({favoriteDishes.length})
              </h2>
              {favoriteDishes.length === 0 ? (
                <EmptyState
                  icon="💝"
                  title="还没有收藏"
                  message="转动转盘，收藏你喜欢的菜品吧~"
                />
              ) : (
                <div className="space-y-3">
                  {favoriteDishes.map(dish => (
                    <DishCard
                      key={dish.id}
                      dish={dish}
                      showRemove
                      onClick={() => { setSelectedDish(dish); setShowModal(true); }}
                      onRemove={() => toggleFavorite(dish.id)}
                    />
                  ))}
                </div>
              )}
            </div>
          );
        }

        if (page === 'history') {
          return (
            <div className="max-w-md mx-auto px-4 py-6">
              <h2 className="text-xl font-bold mb-4" style={{ color: '#5D4E37' }}>
                📜 历史记录 ({history.length})
              </h2>
              {history.length === 0 ? (
                <EmptyState
                  icon="📖"
                  title="暂无历史"
                  message="转动转盘后会记录在这里~"
                />
              ) : (
                <div className="space-y-3">
                  {history.map((dish, index) => (
                    <DishCard
                      key={`${dish.id}-${dish.timestamp}`}
                      dish={dish}
                      showRemove={false}
                      onClick={() => { setSelectedDish(dish); setShowModal(true); }}
                    />
                  ))}
                </div>
              )}
            </div>
          );
        }

        // 首页
        return (
          <div className="max-w-md mx-auto px-4 py-6">
            <Wheel
              dishes={filteredDishes}
              isSpinning={isSpinning}
              onSelect={openModal}
              rotation={rotation}
              selectedDish={selectedDish}
            />
            <div className="flex justify-center">
              <SpinButton onClick={spin} disabled={isSpinning} />
            </div>
            {selectedDish && !isSpinning && (
              <div className="mt-6 text-center">
                <p className="text-sm mb-2" style={{ color: '#8B7355' }}>本次选中：</p>
                <div className="inline-flex items-center gap-2 bg-white px-4 py-2 rounded-full shadow-sm">
                  <span className="text-2xl">{selectedDish.emoji}</span>
                  <span className="font-medium" style={{ color: '#5D4E37' }}>{selectedDish.name}</span>
                </div>
              </div>
            )}
          </div>
        );
      };

      return (
        <div className="min-h-screen pb-20">
          <Header activeTab={activeTab} setActiveTab={setActiveTab} />

          <main className={page !== 'home' ? '' : ''}>
            {renderContent()}
          </main>

          {/* 底部导航 */}
          <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 z-40">
            <div className="max-w-md mx-auto flex">
              <button
                onClick={() => setPage('favorites')}
                className={`flex-1 py-3 flex flex-col items-center gap-1 ${
                  page === 'favorites' ? 'text-[#FF6B6B]' : 'text-gray-400'
                }`}
              >
                <span className="text-xl">{favorites.length > 0 ? '❤️' : '🤍'}</span>
                <span className="text-xs">收藏</span>
              </button>
              <button
                onClick={() => setPage('home')}
                className={`flex-1 py-3 flex flex-col items-center gap-1 ${
                  page === 'home' ? 'text-[#FF9A56]' : 'text-gray-400'
                }`}
              >
                <span className="text-xl">🏠</span>
                <span className="text-xs">首页</span>
              </button>
              <button
                onClick={() => setPage('history')}
                className={`flex-1 py-3 flex flex-col items-center gap-1 ${
                  page === 'history' ? 'text-[#6BCB77]' : 'text-gray-400'
                }`}
              >
                <span className="text-xl">📜</span>
                <span className="text-xs">历史</span>
              </button>
            </div>
          </nav>

          {/* 菜品详情弹窗 */}
          {showModal && (
            <DishModal
              dish={selectedDish}
              onClose={() => setShowModal(false)}
              onReroll={handleReroll}
              isFavorite={favorites.includes(selectedDish?.id)}
              onToggleFavorite={toggleFavorite}
            />
          )}
        </div>
      );
    };

    // 渲染应用
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
